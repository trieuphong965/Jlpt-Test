<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<title>JLPT 模擬試験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#faf8f4; --ink:#1d2125; --ink-2:#5f656d; --ink-3:#8a9098;
  --line:#e5e0d6; --line-2:#d6cfc2;
  --accent:#b23a3a; --accent-ink:#fff; --accent-soft:#f8e9e6;
  --ok:#1f7a4d; --ok-soft:#e2f2e9; --ng:#c0392b; --ng-soft:#fbe7e3; --flag:#c77d00; --flag-soft:#fdf1d6;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
  --r:14px; --bar:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1e2125; --surface-2:#191b1f; --ink:#e9e6e0; --ink-2:#a6acb3; --ink-3:#7d848c;
  --line:#2e3238; --line-2:#3b4047;
  --accent:#e0786a; --accent-ink:#1a0d0b; --accent-soft:#3a2522;
  --ok:#6cc596; --ok-soft:#1c3328; --ng:#ef8b7a; --ng-soft:#3c2320; --flag:#f0b44c; --flag-soft:#3a2f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --surface-2:#191b1f; --ink:#e9e6e0; --ink-2:#a6acb3; --ink-3:#7d848c;
  --line:#2e3238; --line-2:#3b4047;
  --accent:#e0786a; --accent-ink:#1a0d0b; --accent-soft:#3a2522;
  --ok:#6cc596; --ok-soft:#1c3328; --ng:#ef8b7a; --ng-soft:#3c2320; --flag:#f0b44c; --flag-soft:#3a2f1a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.hide{display:none!important}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.serif{font-family:"Noto Serif JP",serif}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
@media (hover:hover){.btn:hover{border-color:var(--ink-3)}}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Home ---------- */
.page{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px}
.brand h1{font-family:"Noto Serif JP",serif;font-weight:600;font-size:1.7rem;margin:0;letter-spacing:.04em}
.lead{margin:0 0 22px;color:var(--ink-2);font-size:.92rem}
.sect-title{font-size:.8rem;font-weight:700;color:var(--ink-2);letter-spacing:.08em;margin:26px 0 10px}
.exam-list{display:grid;gap:12px}
.exam-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.exam-card:hover{border-color:var(--line-2)}
.lv{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:"Noto Serif JP",serif;font-weight:600;font-size:1.25rem;background:var(--accent-soft);color:var(--accent)}
.exam-card .t{font-weight:700;font-size:1.02rem}
.exam-card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--ink-2);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.ng{background:var(--ng-soft);border-color:transparent;color:var(--ng)}
.chip.warn{background:var(--flag-soft);border-color:transparent;color:var(--flag)}
.exam-card .go{margin-left:auto;color:var(--ink-3)}
.minibar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.minibar i{display:block;height:100%;background:var(--accent)}

/* ---------- Intro ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:1200px;margin:0 auto;height:56px;padding:0 8px;display:flex;align-items:center;gap:6px}
.topbar .ttl{flex:1;min-width:0;line-height:1.25}
.topbar .ttl b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl span{display:block;font-size:.75rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.intro-h{font-family:"Noto Serif JP",serif;font-size:1.5rem;font-weight:600;margin:4px 0 4px}
.struct{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
.struct td{padding:9px 0;border-bottom:1px solid var(--line)}
.struct tr:last-child td{border-bottom:0}
.struct td:first-child{width:72%}
.struct td:last-child{text-align:right;color:var(--ink-2);white-space:nowrap}
.timebox{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{min-height:40px;border-radius:9px;font-size:.88rem;font-weight:500;color:var(--ink-2);padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{margin-top:18px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field .hint{font-size:.8rem;color:var(--ink-2);margin-top:6px}
.actions{display:grid;gap:10px;margin-top:22px}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.hist div:last-child{border-bottom:0}

/* ---------- Test layout ---------- */
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.timer.warn{color:var(--ng);border-color:var(--ng);background:var(--ng-soft)}
.count-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.88rem;font-variant-numeric:tabular-nums}
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1100px){.shell{grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding:0 16px}}
.stage{min-width:0;padding:14px 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom))}
.split{display:grid;gap:14px}
@media (min-width:900px){
  .split.has-passage{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .split.has-passage .passage-col{position:sticky;top:72px;max-height:calc(100vh - 72px - var(--bar) - 24px);overflow:auto}
}
.mondai-h{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.mondai-h b{font-family:"Noto Serif JP",serif;font-size:1.05rem}
.instr.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.instr{font-size:.88rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-family:"Noto Serif JP",serif;font-size:1.04rem;line-height:2.05}
.passage p{margin:0 0 .7em;text-indent:1em}
.passage .lbl{font-family:"Noto Sans JP",sans-serif;font-weight:700;text-indent:0;font-size:.9rem;color:var(--ink-2)}
.passage .box{font-family:"Noto Sans JP",sans-serif;font-size:.92rem;line-height:1.8;overflow-x:auto}
.passage table{border-collapse:collapse;width:100%;min-width:520px;margin:8px 0;font-size:.84rem;font-family:"Noto Sans JP",sans-serif;line-height:1.6}
.passage th,.passage td{border:1px solid var(--line-2);padding:5px 7px;vertical-align:top;text-indent:0}
.passage th{background:var(--accent-soft)}
.tblwrap{overflow-x:auto}
.pass-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:.85rem;font-weight:700;color:var(--ink-2);padding:4px 2px 8px}
@media (min-width:900px){.pass-toggle{display:none}}
@media (max-width:899px){.passage-col .passage{max-height:46vh;overflow:auto;overscroll-behavior:contain}.passage-col .passage.open{max-height:none}}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qno{flex:none;min-width:36px;height:36px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.92rem;background:var(--ink);color:var(--bg)}
.stem{flex:1;font-size:1.12rem;line-height:1.9;padding-top:2px}
.stem:empty{display:none}
.stem u{text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--accent)}
.flag-btn{flex:none;margin-left:auto!important;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);margin:-4px -6px 0 0}
.flag-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.flag-btn.on{color:var(--flag)}
.flag-btn.on svg{fill:currentColor}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.04rem;line-height:1.6;transition:border-color .12s,background .12s}
@media (hover:hover){.opt:hover:not(:disabled):not(.sel){border-color:var(--line-2);background:var(--surface-2)}}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:1px}
.opt .tx{flex:1;min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .n{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opts.compact{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.numonly{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.numonly.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.numonly .opt{justify-content:center}
.opts.numonly .opt .tx{display:none}
.opts.numonly .opt .n{width:30px;height:30px;font-size:.95rem}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:14px;font-size:.95rem}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)} .verdict.na{color:var(--ink-2)}
.exp{margin-top:8px;font-size:.93rem;line-height:1.8;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 12px}
.exp.ng{border-left-color:var(--ng)}

/* Listening */
.player{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:12px 0 4px}
.player .play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.player .play svg{width:18px;height:18px;fill:currentColor;stroke:none}
.player .prog{flex:1;min-width:0}
.player .prog .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.player .prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.player .prog .st{font-size:.78rem;color:var(--ink-2);margin-top:3px}
.player.na .st{color:var(--flag)}
.player .scr{font-size:.82rem;font-weight:500;padding:6px 10px;border-radius:8px;color:var(--ink-2);flex:none}
.player .scr:hover{background:var(--surface)}
.script{background:var(--surface);border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-size:.95rem;line-height:1.95}
.script .ln{display:flex;gap:8px}
.script .sp{flex:none;min-width:2.2em;color:var(--ink-3);font-size:.78rem;padding-top:3px}
.script .pz{color:var(--ink-3);font-size:.75rem}

/* Bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottombar .in{max-width:1200px;margin:0 auto;height:var(--bar);padding:0 12px;display:flex;align-items:center;gap:10px}
.bottombar .pos{flex:1;text-align:center;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bottombar .btn{min-width:112px}
@media (min-width:1100px){.bottombar .in{padding-right:340px}}

/* Palette */
.palette{font-size:.85rem}
.pal-sec{margin-bottom:14px}
.pal-sec h4{margin:0 0 6px;font-size:.78rem;color:var(--ink-2);font-weight:700;display:flex;justify-content:space-between}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal-grid button{position:relative;height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:500;font-variant-numeric:tabular-nums}
.pal-grid button.ans{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pal-grid button.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.pal-grid button.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid var(--surface)}
.pal-grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pal-grid button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.pal-grid button.blank{border-style:dashed;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--ink-2);margin:4px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1.5px solid var(--line)}
.legend .a{background:var(--ink);border-color:var(--ink)} .legend .f{background:var(--flag);border-color:var(--flag);border-radius:50%}
.legend .o{background:var(--ok-soft);border-color:var(--ok)} .legend .x{background:var(--ng-soft);border-color:var(--ng)}
.side{display:none}
@media (min-width:1100px){.side{display:block;position:sticky;top:72px;align-self:start;max-height:calc(100vh - 88px);overflow:auto;padding:14px 0 24px}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-h b{font-size:1rem}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.modal .box h3{margin:0 0 6px;font-size:1.1rem}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Result */
.score-hero{display:flex;align-items:center;gap:18px}
.ring{--p:0;flex:none;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring>div{width:90px;height:90px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:1.6rem;font-family:"Noto Serif JP",serif}
.ring span{font-size:.72rem;color:var(--ink-2)}
.verdict-big{font-size:1.25rem;font-weight:700}
.verdict-big.ok{color:var(--ok)} .verdict-big.ng{color:var(--ng)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.sc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sc .k{font-size:.78rem;color:var(--ink-2)}
.sc .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.sc .v small{font-size:.8rem;color:var(--ink-2);font-weight:500}
.sc .s{font-size:.75rem;margin-top:2px}
.sc.low{border-color:var(--ng)} .sc.low .s{color:var(--ng)}
.mrow{display:grid;grid-template-columns:88px 1fr 56px;gap:10px;align-items:center;padding:7px 0;font-size:.88rem;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:99px}
.mrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.review-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

footer{color:var(--ink-3);font-size:.75rem;text-align:center;margin:36px 0 8px}
footer a{color:inherit}
.kbd-hint{display:none;font-size:.75rem;color:var(--ink-3);text-align:center;margin-top:14px}
@media (hover:hover) and (min-width:900px){.kbd-hint{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
