<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<title>JLPT 模擬試験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: kem · giấy kẻ ô · đỏ san hô · khối tối ===== */
:root{
  --bg:#f3efe7; --surface:#fbf9f4; --surface-2:#f6f2ea; --ink:#1f1d1b; --ink-2:#6b655d; --ink-3:#9a948a;
  --line:#e3dccf; --line-2:#cfc6b6; --grid:rgba(60,45,30,.055);
  --accent:#d6603f; --accent-ink:#fff; --accent-soft:#f7e2d9; --accent-line:#ecbfae;
  --dark:#232120; --dark-2:#2e2b29; --dark-ink:#f1ece4; --dark-ink-2:#a59e94;
  --ok:#2f7d55; --ok-soft:#e1efe5; --ng:#c9472b; --ng-soft:#f8e1da; --flag:#c98a12; --flag-soft:#f8ecd2;
  --r:10px; --r-sm:7px; --bar:64px; --side:272px;
  --sans:"Inter","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171614; --surface:#1f1e1b; --surface-2:#1b1a18; --ink:#ece7df; --ink-2:#a8a196; --ink-3:#7a746b;
  --line:#2f2c28; --line-2:#433f39; --grid:rgba(255,240,220,.035);
  --accent:#e8775a; --accent-ink:#1b0f0a; --accent-soft:#3a241c; --accent-line:#6a3a2b;
  --dark:#0f0e0d; --dark-2:#1a1917;
  --ok:#73c495; --ok-soft:#1c3125; --ng:#f08d75; --ng-soft:#3b221b; --flag:#f0b44c; --flag-soft:#3a2f1a;
}}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#1f1e1b; --surface-2:#1b1a18; --ink:#ece7df; --ink-2:#a8a196; --ink-3:#7a746b;
  --line:#2f2c28; --line-2:#433f39; --grid:rgba(255,240,220,.035);
  --accent:#e8775a; --accent-ink:#1b0f0a; --accent-soft:#3a241c; --accent-line:#6a3a2b;
  --dark:#0f0e0d; --dark-2:#1a1917;
  --ok:#73c495; --ok-soft:#1c3125; --ng:#f08d75; --ng-soft:#3b221b; --flag:#f0b44c; --flag-soft:#3a2f1a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.hide{display:none!important}
.muted{color:var(--ink-2)}
.small{font-size:.8rem}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.gridpaper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.hatch{background:repeating-linear-gradient(-45deg,var(--accent) 0 3px,color-mix(in srgb,var(--accent) 35%,transparent) 3px 6px)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:.9rem;white-space:nowrap}
@media (hover:hover){.btn:hover{border-color:var(--ink-3)}}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.pri:hover{filter:brightness(1.06)}}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
@media (hover:hover){.icon-btn:hover{background:var(--surface-2)}}
.icon-btn svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== App bar ===== */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:1440px;margin:0 auto;height:56px;padding:0 10px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:.98rem}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--dark);display:grid;place-items:center;color:var(--accent);font-style:normal;font-size:.8rem;font-family:"Noto Serif JP",serif}
.logo b{color:var(--accent);background:var(--accent-soft);padding:0 5px;border-radius:4px;font-weight:700}
.topbar .ttl{flex:1;min-width:0;line-height:1.25}
.topbar .ttl b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl span{display:block;font-size:.72rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:.88rem;padding:6px 10px;border-radius:var(--r-sm);background:var(--dark);color:var(--dark-ink)}
.timer.warn{background:var(--ng);color:#fff}
.count-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums}
@media (min-width:1100px){.count-btn{display:none}}

/* ===== Home / intro ===== */
.page{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.hero{border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;margin:6px 0 22px;position:relative;overflow:hidden}
.hero h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.hero p{margin:0;color:var(--ink-2);font-size:.9rem;max-width:34em;padding-right:88px}
.hero .blocks{position:absolute;right:16px;bottom:14px;display:flex;align-items:flex-end;gap:5px;opacity:.95}
.hero .blocks span{width:16px;border-radius:3px}
.sect-title{margin:24px 0 10px}
.exam-list{display:grid;gap:10px}
.exam-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
@media (hover:hover){.exam-card:hover{border-color:var(--accent-line)}}
.lv{flex:none;width:52px;height:52px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background:var(--dark);color:var(--dark-ink);position:relative;overflow:hidden}
.lv::after{content:"";position:absolute;right:0;bottom:0;width:40%;height:40%;background:repeating-linear-gradient(-45deg,var(--accent) 0 2px,transparent 2px 4px)}
.exam-card .t{font-weight:700;font-size:1rem}
.exam-card .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.8rem;color:var(--ink-2);margin-top:3px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.ng{background:var(--ng-soft);border-color:transparent;color:var(--ng)}
.chip.warn{background:var(--flag-soft);border-color:transparent;color:var(--flag)}
.exam-card .go{margin-left:auto;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.intro-h{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.struct{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
.struct td{padding:10px 0;border-bottom:1px solid var(--line)}
.struct tr:last-child td{border-bottom:0}
.struct td:first-child{width:72%}
.struct td:last-child{text-align:right;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.timebox{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
.seg button{min-height:38px;border-radius:7px;font-size:.86rem;font-weight:600;color:var(--ink-2);padding:0 6px}
.seg button.on{background:var(--dark);color:var(--dark-ink)}
.field{margin-top:18px}
.field>.eyebrow{display:block;margin-bottom:7px}
.field .hint{font-size:.8rem;color:var(--ink-2);margin-top:6px}
.actions{display:grid;gap:10px;margin-top:22px}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem;font-variant-numeric:tabular-nums}
.hist div:last-child{border-bottom:0}

/* ===== Test layout ===== */
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.shell{grid-template-columns:var(--side) minmax(0,1fr)}}
.stage{min-width:0;padding:14px 14px calc(var(--bar) + 24px + env(safe-area-inset-bottom))}
@media (min-width:1100px){.stage{padding:16px 20px calc(var(--bar) + 24px)}}
.qhead-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.qhead-row h2{margin:2px 0 0;font-size:1.25rem;font-weight:800;letter-spacing:-.015em}
.instr{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--ink-2);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:8px 12px;margin:0 0 12px}
.instr .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--accent);font-size:.72rem;font-weight:800;margin-top:1px}
.instr .tx{min-width:0}
.instr.clamp .tx{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.instr.clamp .tx>.eyebrow,.instr.clamp .tx>br{display:none}
@media (max-width:699px){.qhead-row h2{font-size:1.05rem}}
.instr{cursor:pointer}
.canvas{border:1px solid var(--line);border-radius:var(--r);padding:14px}
@media (min-width:700px){.canvas{padding:20px}}
.split{display:grid;gap:14px}
@media (min-width:900px){
  .split.has-passage{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .split.has-passage .passage-col{position:sticky;top:72px;max-height:calc(100vh - 72px - var(--bar) - 32px);overflow:auto;border-radius:var(--r)}
}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-family:"Noto Serif JP",serif;font-size:1.03rem;line-height:2.05}
.passage p{margin:0 0 .7em;text-indent:1em}
.passage .lbl{font-family:var(--sans);font-weight:700;text-indent:0;font-size:.82rem;color:var(--ink-2)}
.passage .box{font-family:var(--sans);font-size:.9rem;line-height:1.8;overflow-x:auto}
.passage table{border-collapse:collapse;width:100%;min-width:520px;margin:8px 0;font-size:.82rem;font-family:var(--sans);line-height:1.6}
.passage th,.passage td{border:1px solid var(--line-2);padding:5px 7px;vertical-align:top;text-indent:0}
.passage th{background:var(--accent-soft)}
.tblwrap{overflow-x:auto}
.pass-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:2px 2px 8px}
@media (min-width:900px){.pass-toggle{display:none}}
@media (max-width:899px){.passage-col .passage{max-height:46vh;overflow:auto;overscroll-behavior:contain}.passage-col .passage.open{max-height:none}}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qno{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:.88rem;background:var(--dark);color:var(--dark-ink);font-variant-numeric:tabular-nums}
.stem{flex:1;font-size:1.1rem;line-height:1.95;padding-top:1px;font-family:"Noto Sans JP",var(--sans)}
.stem:empty{display:none}
.stem u{text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--accent)}
.flag-btn{flex:none;margin-left:auto;width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3);margin-top:-3px;margin-right:-4px}
.flag-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.flag-btn.on{color:var(--flag)}
.flag-btn.on svg{fill:currentColor}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:50px;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:1.03rem;line-height:1.6;font-family:"Noto Sans JP",var(--sans);transition:border-color .12s,background .12s}
@media (hover:hover){.opt:hover:not(:disabled):not(.sel){border-color:var(--line-2);background:var(--surface-2)}}
.opt .n{flex:none;width:25px;height:25px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:.78rem;font-weight:800;margin-top:1px;font-family:var(--sans)}
.opt .tx{flex:1;min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .n{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.opts.compact{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.numonly{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.numonly.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.numonly .opt{justify-content:center}
.opts.numonly .opt .tx{display:none}
.opts.numonly .opt .n{width:30px;height:30px;font-size:.92rem}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:14px;font-size:.92rem}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)} .verdict.na{color:var(--ink-2)}
.exp{margin-top:8px;font-size:.92rem;line-height:1.8;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r-sm);padding:10px 12px}
.exp.ng{border-left-color:var(--ng)}
.exp .eyebrow{display:block;margin-bottom:2px}

/* Stepper: các câu trong 問題 hiện tại */
.stepper{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px 8px}
.stepper .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.steps{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:6px 6px 4px}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 44px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-size:.68rem;color:var(--ink-3);min-width:44px}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:1.5px;background:var(--line-2);z-index:0}
.step:first-child::before{display:none}
.step .c{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:700;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.ans .c{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.step.ok .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.ng .c{background:var(--ng);border-color:var(--ng);color:#fff}
.step.cur .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.step.cur{color:var(--ink);font-weight:700}
.step.flag .c::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--flag);border:1.5px solid var(--surface)}

/* Listening: khối tối */
.player{display:flex;align-items:center;gap:12px;background:var(--dark);color:var(--dark-ink);border-radius:var(--r);padding:10px 12px;margin:12px 0 4px}
.player .play{width:42px;height:42px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.player .play svg{width:16px;height:16px;fill:currentColor;stroke:none}
.player .prog{flex:1;min-width:0}
.player .prog .bar{height:6px;border-radius:3px;background:var(--dark-2);overflow:hidden}
.player .prog .bar i{display:block;height:100%;width:0;transition:width .2s;background:repeating-linear-gradient(-45deg,var(--accent) 0 3px,color-mix(in srgb,var(--accent) 55%,#000) 3px 6px)}
.player .prog .st{font-size:.76rem;color:var(--dark-ink-2);margin-top:4px}
.player.na .st{color:var(--flag)}
.player .scr{font-size:.76rem;font-weight:600;padding:6px 9px;border-radius:6px;color:var(--dark-ink-2);border:1px solid var(--dark-2);flex:none}
.script{background:var(--dark);color:var(--dark-ink);border-radius:var(--r);padding:10px 12px;margin:6px 0 4px;font-size:.92rem;line-height:1.95;font-family:"Noto Sans JP",var(--sans)}
.script .ln{display:flex;gap:10px}
.script .sp{flex:none;min-width:2.2em;color:var(--accent);font-size:.72rem;font-weight:700;padding-top:4px;font-family:var(--mono)}
.script .pz{color:var(--dark-ink-2);font-size:.72rem;font-family:var(--mono)}

/* Bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottombar .in{max-width:1440px;margin:0 auto;height:var(--bar);padding:0 12px;display:flex;align-items:center;gap:10px}
@media (min-width:1100px){.bottombar .in{padding-left:calc(var(--side) + 20px);padding-right:20px}}
.bottombar .pos{flex:1;text-align:center;font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bottombar .btn{min-width:104px}
.bottombar .btn .lbl-long{display:none}
@media (min-width:700px){.bottombar .btn .lbl-long{display:inline}}

/* Sidebar trái (desktop) + palette */
.side{display:none}
@media (min-width:1100px){.side{display:flex;flex-direction:column;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);border-right:1px solid var(--line);background:var(--surface-2)}}
.side .scroll{flex:1;overflow:auto;padding:14px 14px 10px}
.side .foot{border-top:1px solid var(--line);padding:12px 14px}
.prog-line{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog-line .bar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog-line .bar i{display:block;height:100%;background:var(--accent)}
.palette{font-size:.85rem}
.tree-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pal-sec{margin-bottom:4px}
.pal-sec>button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px;border-radius:6px;text-align:left;font-size:.82rem}
.pal-sec>button:hover{background:var(--surface)}
.pal-sec>button .ar{width:12px;color:var(--ink-3);transition:transform .15s;font-size:.7rem}
.pal-sec.open>button .ar{transform:rotate(90deg)}
.pal-sec>button .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-sec>button .nm small{color:var(--ink-3);margin-left:4px}
.pal-sec>button .ct{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pal-sec.cur>button{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pal-sec.cur>button .ct{color:var(--accent)}
.pal-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;padding:6px 4px 10px 26px}
.pal-sec.open .pal-grid{display:grid}
.pal-grid button{position:relative;height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:.76rem;font-weight:600;font-variant-numeric:tabular-nums}
.pal-grid button.ans{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.pal-grid button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pal-grid button.ans.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pal-grid button.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--flag);border:2px solid var(--surface)}
.pal-grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pal-grid button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.pal-grid button.blank{border-style:dashed;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.72rem;color:var(--ink-2);margin:2px 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--line-2)}
.legend .a{background:var(--dark);border-color:var(--dark)} .legend .f{background:var(--flag);border-color:var(--flag);border-radius:50%}
.legend .o{background:var(--ok-soft);border-color:var(--ok)} .legend .x{background:var(--ng-soft);border-color:var(--ng)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface-2);width:100%;max-width:640px;max-height:84vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet .pal-grid{padding-left:4px;grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
.sheet .pal-grid button{height:40px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:380px;width:100%}
.modal .box h3{margin:0 0 6px;font-size:1.05rem;font-weight:800}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ===== Result ===== */
.score-hero{display:flex;align-items:center;gap:18px}
.big-score{flex:none;width:118px;height:118px;border-radius:12px;background:var(--dark);color:var(--dark-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}
.big-score b{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.big-score span{font-size:.72rem;color:var(--dark-ink-2);margin-top:4px}
.big-score .fill{position:absolute;left:0;right:0;bottom:0;opacity:.9}
.big-score>*:not(.fill){position:relative}
.verdict-big{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.verdict-big.ok{color:var(--ok)} .verdict-big.ng{color:var(--ng)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.sc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.sc .v{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc .v small{font-size:.78rem;color:var(--ink-2);font-weight:500}
.sc .s{font-size:.72rem;margin-top:2px}
.sc.low{border-color:var(--ng)} .sc.low .s{color:var(--ng)}
.mrow{display:grid;grid-template-columns:96px 1fr 52px;gap:12px;align-items:center;padding:8px 0;font-size:.86rem;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .bar{height:10px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.mrow .bar i{display:block;height:100%}
.mrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.review-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

footer{color:var(--ink-3);font-size:.72rem;text-align:center;margin:30px 0 8px}
footer a{color:inherit}
.kbd-hint{display:none;font-size:.72rem;color:var(--ink-3);text-align:center;margin-top:12px}
.kbd-hint kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
@media (hover:hover) and (min-width:900px){.kbd-hint{display:block}}
</style>
</head>
