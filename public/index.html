<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT 模擬試験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e3ded3;
  --accent:#9c2f2f; --accent-soft:#f4e6e3; --ok:#2f7a4f; --ok-soft:#e5f2ea; --ng:#b3402f; --ng-soft:#f8e4df;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181b;--paper:#1e2125;--ink:#e8e6e1;--muted:#9aa0a6;--line:#30343a;
  --accent:#e07a6a;--accent-soft:#3a2724;--ok:#6cc08d;--ok-soft:#1f3328;--ng:#ef8a78;--ng-soft:#3b2420}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font-family:"Noto Serif JP",serif;font-weight:600;font-size:1.6rem;margin:24px 0 4px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 24px}
.cards{display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;color:inherit}
.card:hover{border-color:var(--accent)}
.lv{font-family:"Noto Serif JP",serif;font-weight:600;font-size:1.3rem;color:var(--accent);background:var(--accent-soft);border-radius:10px;width:54px;height:54px;display:grid;place-items:center;flex:none}
.card .t{font-weight:500}
.card .m{color:var(--muted);font-size:.82rem}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top .name{font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--paper)}
.pill.warn{color:var(--ng);border-color:var(--ng)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.mondai{margin:28px 0 8px}
.mh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.mh b{font-family:"Noto Serif JP",serif;font-size:1.05rem;white-space:nowrap}
.mh .sec{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.instr{font-size:.92rem;color:var(--muted);margin:0 0 12px}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;font-family:"Noto Serif JP",serif;font-size:1.02rem;line-height:2;margin:10px 0 14px}
.passage p{margin:0 0 .6em;text-indent:1em}
.passage .lbl{font-family:"Noto Sans JP";font-weight:700;text-indent:0}
.box{font-family:"Noto Sans JP",sans-serif;font-size:.92rem;line-height:1.8}
.box{overflow-x:auto}
.box table{border-collapse:collapse;width:100%;min-width:560px;margin:8px 0;font-size:.82rem}
.box th,.box td{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.box th{background:var(--accent-soft)}
.tblwrap{overflow-x:auto}
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.qs{display:flex;gap:10px}
.qn{flex:none;min-width:28px;height:28px;border-radius:8px;border:1px solid var(--ink);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.stem{flex:1;font-size:1.02rem}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.opts{display:grid;gap:6px;margin:10px 0 2px 38px}
.opts.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:620px){.opts.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:transparent;color:inherit;width:100%}
.opt .n{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--muted);font-size:.75rem;display:grid;place-items:center;margin-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .n{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.exp{margin:10px 0 0 38px;font-size:.88rem;border-left:3px solid var(--ok);padding:4px 10px;background:var(--ok-soft);border-radius:0 8px 8px 0}
.q.isng .exp{border-color:var(--ng);background:var(--ng-soft)}
.result{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0}
.big{font-family:"Noto Serif JP",serif;font-size:2.4rem;font-weight:600;line-height:1.1}
.rows{display:grid;gap:10px;margin-top:14px}
.row{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.note{font-size:.82rem;color:var(--muted)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.filter .btn.on{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box2{background:var(--paper);border-radius:var(--radius);padding:20px;max-width:360px;width:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:5}
.nav .in{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;gap:4px;overflow-x:auto}
.nav a{flex:none;font-size:.78rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.nav a.done{color:var(--accent);border-color:var(--accent)}
footer{color:var(--muted);font-size:.78rem;margin-top:40px;text-align:center}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tabs .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 10px;font-size:.88rem}
.player .btn{padding:4px 12px}
.player .st{color:var(--muted)}
.player.na .st{color:var(--ng)}
.script{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:6px 0 10px;font-size:.92rem;line-height:1.9}
.script .sp{display:inline-block;min-width:2.6em;color:var(--muted);font-size:.78rem}
.script .pz{color:var(--muted);font-size:.75rem}
.lq .stem:empty{display:none}
.sync{font-size:.72rem;color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
